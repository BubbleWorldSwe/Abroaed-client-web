name: Build and Deploy Frontend

on:
  push:
    branches:
      - mainline

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.15.1'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add Lightsail Server to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_PUBLIC_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server using rsync
        run: |
          ssh bitnami@${{ secrets.EC2_PUBLIC_IP }} 'rm -rf ~/react-app/*'
          rsync -avz --delete-after --exclude '.git' --exclude '.github' ./dist/ bitnami@${{ secrets.EC2_PUBLIC_IP }}:~/react-app
